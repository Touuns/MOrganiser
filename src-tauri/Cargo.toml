[package]
name = "morganiser"
version = "0.1.0"
description = "M'Organiser — centre de contrôle personnel, local-first"
edition = "2021"
publish = false

[lib]
# Le code applicatif vit dans la bibliothèque (testable) ; main.rs ne fait que l'appeler.
name = "morganiser_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = [] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
tempfile = "3.27"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
